<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:description" content="Timer, round tracker, score keeper and match history for X-Wing Miniatures.">

<meta name="mobile-web-app-capable" content="yes">

<title>X-Wing Game Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sticky HUD bar over a two-up board. Timer and round tracker sit on top, one card per player below.
   Each player card is tinted by its faction. Dark flight-deck palette first, light variant for bright rooms. */
:root {
  --bg: #090d15;
  --surface: #101725;
  --surface-2: #172134;
  --surface-3: #1f2b42;
  --line: #26324a;
  --fg: #e8edf7;
  --fg-dim: #98a4bc;
  --fg-faint: #66738d;
  --accent: #8bb8ff;
  --on-accent: #08111f;
  --ok: #4fd6a0;
  --warn: #ffb23e;
  --yellow: #ffd23f;
  --crit: #ff5d57;
  --shield: #5db8ff;
  --hull: #ffd23f;
  --p1: #2ad4f0;
  --p2: #ff4d54;
  --p1t: #2ad4f0;
  --p2t: #ff6b70;
  --glow: .16;
  --font-display: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --radius: 16px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9edf5; --surface: #ffffff; --surface-2: #f2f5fb; --surface-3: #e4eaf4; --line: #d0d9e8;
    --fg: #0d1626; --fg-dim: #4a5874; --fg-faint: #8591a9;
    --accent: #1f5fd6; --on-accent: #ffffff;
    --ok: #0b8f61; --warn: #a96300; --crit: #c92a25; --shield: #1488dc; --hull: #e0a800; --glow: .13; --yellow: #e0a800;
    --p1: #17b4d1; --p2: #ef4444; --p1t: #0a7d93; --p2t: #c62828;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e9edf5; --surface: #ffffff; --surface-2: #f2f5fb; --surface-3: #e4eaf4; --line: #d0d9e8;
  --fg: #0d1626; --fg-dim: #4a5874; --fg-faint: #8591a9;
  --accent: #1f5fd6; --on-accent: #ffffff;
  --ok: #0b8f61; --warn: #a96300; --crit: #c92a25; --shield: #1488dc; --hull: #e0a800; --glow: .13; --yellow: #e0a800;
  --p1: #17b4d1; --p2: #ef4444; --p1t: #0a7d93; --p2t: #c62828;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  padding-inline: 16px; padding-block: 0 48px;
  min-height: 100%; -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60% 50% at 0% 0%, color-mix(in srgb, var(--p1) calc(var(--glow) * 100%), transparent), transparent 70%),
    radial-gradient(60% 50% at 100% 0%, color-mix(in srgb, var(--p2) calc(var(--glow) * 100%), transparent), transparent 70%);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-dim); font-weight: 600; }
svg { display: block; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- HUD bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: -16px; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 30px; height: 30px; object-fit: contain; transform: translateY(2px); }
.brand b { font-family: var(--font-display); font-size: 19px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; white-space: nowrap; }
.hud { flex: 1; display: flex; justify-content: center; align-items: center; gap: 16px; min-width: 0; }
.hud .cell { display: flex; flex-direction: column; align-items: center; line-height: 1; gap: 3px; white-space: nowrap; flex: none; }
.hud .cell .num { font-size: 22px; font-weight: 600; }
.hud .cell .label { font-size: 9px; letter-spacing: .16em; }
.hud .num { white-space: nowrap; }
.hud .vs { color: var(--fg-faint); font-size: 16px; }
.hud .s1 { color: var(--p1t); } .hud .s2 { color: var(--p2t); }
.hud .t.warn { color: var(--warn); } .hud .t.crit { color: var(--crit); }
.tools { display: flex; gap: 4px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  color: var(--fg-dim); background: transparent; transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn:disabled:hover { background: transparent; color: var(--fg-dim); }

main { max-width: 1240px; margin: 0 auto; padding-top: 16px; display: grid; gap: 16px; }
.top { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.players { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) {
  .top { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
  .players { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }

/* ---------- buttons ---------- */
.btn {
  min-height: 44px; padding: 0 16px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface-3); color: var(--fg); font-weight: 600; font-size: 15px; transition: transform .08s, background .15s, filter .15s;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: color-mix(in srgb, var(--crit) 20%, var(--surface-3)); color: var(--crit); }
.btn.armed { background: var(--crit); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }

/* ---------- timer ---------- */
.timer { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.ring { position: relative; width: clamp(128px, 36vw, 168px); aspect-ratio: 1; flex: none; }
.ring svg { width: 100%; height: 100%; }
.ring .track { stroke: var(--surface-3); }
.ring .prog { stroke: var(--accent); transition: stroke .3s; }
.ring .tk { stroke: var(--fg-faint); }
.ring .tk.major { stroke: var(--fg-dim); }
.ring .face { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.ring .time { font-size: clamp(34px, 9vw, 44px); font-weight: 600; line-height: 1; }
.ring .state { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-dim); font-weight: 600; }
.timer[data-level="warn"] .prog { stroke: var(--warn); }
.timer[data-level="crit"] .prog, .timer[data-level="done"] .prog { stroke: var(--crit); }
.timer[data-level="warn"] .time { color: var(--warn); }
.timer[data-level="crit"] .time, .timer[data-level="done"] .time { color: var(--crit); }
.timer[data-level="done"] .time { animation: pulse 1s ease-in-out infinite; }
.timer .side { display: grid; gap: 10px; min-width: 0; }
.timer .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.adj { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.adj .btn { padding: 0; min-height: 38px; font-size: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--fg-dim); font-size: 13px; }
.meta b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.banner { padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--crit) 18%, transparent); color: var(--crit); font-weight: 600; font-size: 13px; }
@media (min-width: 900px) {
  .timer { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .ring { width: 232px; }
  .ring .time { font-size: 62px; }
  .timer .side { width: 100%; }
  .meta { justify-content: center; }
}
@keyframes pulse { 50% { opacity: .45; } }

/* ---------- round ---------- */
.round-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.round-head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: .02em; }
.round-head h2 small { font-size: 20px; color: var(--fg-dim); font-weight: 500; }
.pace { font-size: 13px; color: var(--fg-dim); }
.pace b { color: var(--fg); font-variant-numeric: tabular-nums; }
.pace.tight b { color: var(--warn); }
.pips { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 5px; margin-bottom: 14px; }
.pips.many { grid-template-columns: repeat(10, minmax(0, 1fr)); }
.pip {
  height: 40px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-faint);
  font-family: var(--font-display); font-size: 16px; font-weight: 600; display: grid; place-items: center; transition: background .15s;
}
.pip.done { background: var(--surface-3); color: var(--fg-dim); }
.pip.now { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.phases { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-bottom: 12px; }
.phase {
  min-height: 44px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-dim);
  font-size: 11.5px; font-weight: 600; letter-spacing: .02em; padding: 0 2px; display: grid; place-items: center; text-align: center;
}
.phase.now { background: color-mix(in srgb, var(--accent) 18%, var(--surface-2)); border-color: var(--accent); color: var(--fg); }
.phase.past { color: var(--fg-faint); }
.phase-hint { font-size: 13px; color: var(--fg-dim); margin: 0 0 12px; min-height: 36px; }
.round-nav { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
@media (min-width: 480px) { .phase { font-size: 13px; letter-spacing: .04em; } }

/* ---------- player ---------- */
.player { --c: var(--p1); padding: 0; overflow: hidden; border-color: color-mix(in srgb, var(--c) 38%, var(--line)); }
.player[data-i="1"] { --c: var(--p2); }
.ph { padding: 14px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 20%, var(--surface)), var(--surface)); }
.ph .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); flex: none; }
.name-in {
  flex: 1 1 140px; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed transparent;
  font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: .02em; padding: 2px 0;
}
.name-in:hover, .name-in:focus { border-bottom-color: var(--line); }
.sel {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; min-height: 36px; padding: 0 8px; font-size: 13px; max-width: 100%;
}
.fbadge { display: inline-flex; align-items: center; justify-content: center; text-align: center; line-height: 1; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.fbadge.none { color: var(--fg-faint); font-weight: 500; }
.sq-toggle .t .fdot { margin-right: 2px; }
.init { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg-dim); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.init[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #0b0f17; }
.scorebox { padding: 8px 16px 16px; display: grid; gap: 12px; }
.sc-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.score { font-size: clamp(84px, 22vw, 128px); font-weight: 700; line-height: .85; color: var(--fg); }
.score.bump { animation: bump .28s ease-out; }
@keyframes bump { 0% { transform: scale(1.14); color: var(--c); } 100% { transform: scale(1); } }
.sc-side { text-align: right; display: grid; gap: 6px; justify-items: end; padding-bottom: 4px; min-width: 0; }
.lead { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--surface-3); color: var(--fg-dim); white-space: nowrap; }
.lead.up { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
.lead.down { background: color-mix(in srgb, var(--crit) 16%, transparent); color: var(--crit); }
.split { font-size: 13px; color: var(--fg-dim); }
.split b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pbtn { min-height: 54px; border-radius: 13px; font-family: var(--font-display); font-size: 24px; font-weight: 600; transition: transform .08s, filter .15s; }
.pbtn:active { transform: scale(.95); }
.pbtn.plus { background: var(--c); color: #0b0f17; }
.pbtn.plus:hover { filter: brightness(1.1); }
.pbtn.minus { background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-dim); min-height: 44px; font-size: 20px; }
.pbtn.minus:hover { color: var(--fg); background: var(--surface-3); }

/* ---------- squad ---------- */
.squad { border-top: 1px solid var(--line); padding: 14px 16px 16px; display: grid; gap: 12px; }
.sq-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.sq-head .t { display: grid; gap: 2px; min-width: 0; }
.sq-head .t b { font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: .03em; overflow-wrap: anywhere; }
.sq-head .t span { font-size: 13px; color: var(--fg-dim); }
.sq-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 18px 14px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--fg-dim); font-size: 14px; }
.empty p { margin: 0; max-width: 34ch; }
.ship { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ship[data-state="half"] { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.ship[data-state="dead"] { border-color: color-mix(in srgb, var(--crit) 45%, var(--line)); }
.ship[data-state="dead"] .s-head { opacity: .55; }
.s-head { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px; text-align: left; }
.initb { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--c); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.s-name { font-weight: 600; font-size: 16px; line-height: 1.2; overflow-wrap: anywhere; }
.s-name i { font-style: normal; color: var(--c); margin-right: 4px; }
.s-sub { font-size: 12.5px; color: var(--fg-dim); overflow-wrap: anywhere; }
.cost { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--fg-dim); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-3); color: var(--fg-dim); letter-spacing: .02em; }
.chip.half { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.chip.dead { background: color-mix(in srgb, var(--crit) 20%, transparent); color: var(--crit); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.s-body { padding: 0 12px 12px; display: grid; gap: 10px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 6px; min-width: 0; }
.stat.wide { grid-column: 1 / -1; }
.stat .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.rec { font-style: normal; font-size: 10.5px; letter-spacing: .04em; text-transform: none; color: var(--accent); font-weight: 600; }
.stat .top .val { font-family: var(--font-display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .top .val small { color: var(--fg-faint); font-weight: 500; font-size: 14px; }
.step { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; align-items: center; }
.step .dots { grid-column: 1 / -1; order: -1; }
.step button { height: 40px; border-radius: 10px; background: var(--surface-3); font-size: 20px; font-weight: 600; line-height: 1; }
.step button:active { transform: scale(.94); }
.step button:disabled { opacity: .35; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; min-height: 14px; }
.dots i { width: 14px; height: 14px; border-radius: 4px; background: var(--surface-3); }
.dots i.on { background: var(--k); }
.dots.shield { --k: var(--shield); } .dots.hull { --k: var(--hull); } .dots.charge { --k: var(--warn); } .dots.force { --k: #c79bff; }
.dots i.on { border-radius: 4px; }
.dots.shield i { border-radius: 50%; }
.sub-h { margin: 4px 0 0; }
.up { display: grid; gap: 6px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.up .u-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.up .u-n { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.up .u-n small { color: var(--fg-dim); font-weight: 500; margin-left: 6px; }
.up .u-c { font-family: var(--font-display); color: var(--fg-dim); font-size: 16px; }
.txt { font-size: 13px; color: var(--fg-dim); line-height: 1.45; margin: 0; overflow-wrap: anywhere; }
.txt .tg { display: inline-block; padding: 0 5px; border-radius: 5px; background: var(--surface-3); color: var(--fg); font-size: 11.5px; font-weight: 600; }
.toks { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.tok { display: grid; grid-template-columns: 30px 1fr 30px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tok button { height: 36px; font-size: 16px; color: var(--fg-dim); }
.tok button:active { background: var(--surface-3); }
.tok span { text-align: center; font-size: 11px; line-height: 1.15; padding: 2px 0; color: var(--fg-dim); }
.tok span b { display: block; font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--fg-dim); }
.tok.has { border-color: var(--accent); }
.tok.has span b { color: var(--accent); }
.s-actions { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- dialogs ---------- */
dialog {
  width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; margin: auto;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
}
dialog[open] { display: flex; flex-direction: column; animation: pop .18s ease-out; }
dialog::backdrop { background: rgba(4, 7, 13, .66); backdrop-filter: blur(3px); }
@keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } }
.d-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.d-head h3 { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: .03em; }
.d-body { padding: 16px; overflow: auto; display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }

.g-clock { --fc: var(--accent); position: relative; flex: .55 1 0; min-height: 132px; border-radius: 26px; overflow: hidden; background: var(--surface-3); border: 1px solid var(--line); }
.g-fill { --f: 1; position: absolute; inset: 0; background: color-mix(in srgb, var(--fc) 42%, var(--surface)); clip-path: inset(0 calc((1 - var(--f)) * 100%) 0 0); transition: background .3s; }

.g-state { grid-area: state; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-dim); font-weight: 600; }
.g-play { grid-area: play; width: clamp(48px, 8vh, 68px); height: clamp(48px, 8vh, 68px); border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.g-play:active { transform: scale(.94); } .g-play .ic { width: 45%; height: 45%; }
.pi { display: block; width: 9px; height: 9px; flex: none; background: var(--hull); }
.pi.sh { background: var(--shield); border-radius: 50%; }

body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; pointer-events: none; }
.g-dots { gap: 0; } .g-dots button { width: 20px; }

}
.g-rbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }

<script>
(() => {
'use strict';
const D = window.XW_DATA || { ships: {}, pilots: {}, upgrades: {}, v: 'missing' };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const canon = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const uid = () => Math.random().toString(36).slice(2, 9);

const FACTIONS = {
  rebelalliance: { n: 'Rebel Alliance', c: '#ff5a4d' },
  galacticempire: { n: 'Galactic Empire', c: '#3fd18f' },
  scumandvillainy: { n: 'Scum and Villainy', c: '#e0a93b' },
  resistance: { n: 'Resistance', c: '#ff8f3a' },
  firstorder: { n: 'First Order', c: '#d4455f' },
  galacticrepublic: { n: 'Galactic Republic', c: '#c4a77d' },
  separatistalliance: { n: 'Separatist Alliance', c: '#5f95f5' },
  none: { n: 'No faction', c: '#9aa7bf' },
};
const PHASES = [
  ['Planning', 'Everyone secretly dials a maneuver.'],
  ['System', 'Resolve system phase abilities, then reveal dials in some games.'],
  ['Activation', 'Ships move and act in initiative order, lowest first.'],
  ['Engagement', 'Ships attack in initiative order, highest first.'],
  ['End', 'Remove tokens and check objectives. Each ship recovers 1 Force and recurring charges when you move to the next round.'],
];
const TOKENS = [['focus', 'Focus'], ['evade', 'Evade'], ['calc', 'Calculate'], ['lock', 'Lock'], ['stress', 'Stress'], ['strain', 'Strain'], ['ion', 'Ion'], ['jam', 'Jam'], ['tractor', 'Tractor'], ['deplete', 'Deplete']];
const KEY = 'xwdash.v1', HKEY = 'xwdash.history.v1';
const RULES = 'https://www.xwing.life/content/scenarios.pdf';
const SCENARIOS = {
  assault: { n: 'Assault at the Satellite Array', page: 3, setup: '5 satellites', obj: 'Take control of the Satellite Array before enemy forces do.',
    score: 'Each player earns 2 mission points if they control at least 1 satellite, or 4 if they control more satellites than their opponent. You control a satellite with more ships at range 0–1 of it than any other player. Medium and large ships count as two.' },
  chance: { n: 'Chance Engagement', page: 4, setup: '1 satellite', obj: 'Defeat enemy forces to force a retreat from the sector.',
    score: 'You earn 2 mission points if you contest the satellite (a ship at range 0–2). If only you are contesting it, you score 2 more.' },
  salvage: { n: 'Salvage Mission', page: 5, setup: '5 supply caches', obj: 'Retrieve as many supply caches as possible before the enemy.',
    score: 'You earn 2 mission points if you have at least 1 supply cache on a friendly ship card, or 4 if you hold more than your opponent.' },
  scramble: { n: 'Scramble the Transmissions', page: 6, setup: '3 satellites', obj: 'Scramble the transmissions from the satellites to deny enemy forces valuable information.',
    score: 'Each player earns 2 mission points if they control at least 1 satellite, or 4 if they control more than their opponent. The player whose marker is on a satellite controls it.' },
  ancient: { n: 'Ancient Knowledge', page: 7, setup: '3 data caches', obj: 'Find forgotten knowledge, and use it to your advantage against your enemy.',
    score: 'You earn 2 mission points if at least 1 of your ships has the Ancient Knowledge condition, or 4 if you have more such ships than your opponent. Scoring 4 means one of your ships loses the condition.' },
};
const rulesUrl = k => RULES + '#page=' + (SCENARIOS[k] ? SCENARIOS[k].page : 2);

/* ---------- state ---------- */
const newPlayer = (i) => ({ name: 'Player ' + (i + 1), faction: 'none', manual: 0, init: false, squad: null });
const fresh = () => ({
  v: 1,
  settings: { minutes: 75, rounds: 12, sound: true, wake: false, auto: true, target: 50, me: -1, swap: false, hideTok: false, p2stats: false, tapFilter: false },
  timer: { status: 'idle', total: 75 * 60000, remaining: 75 * 60000, endAt: 0, warned: {} },
  round: 1, phase: 0, scenario: '', result: null,
  ui: { collapsed: [false, false], view: 'board' },
  players: [newPlayer(0), newPlayer(1)],
  log: [],
});
let S = fresh();
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (raw && raw.v === 1) S = Object.assign(fresh(), raw, { settings: Object.assign(fresh().settings, raw.settings), ui: Object.assign(fresh().ui, raw.ui) });
} catch (e) {}
let undoStack = [];
const OPEN = new Set();
let saveT = 0;
const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 200); };

/* ---------- history store ---------- */
let H = { matches: [], lists: [], del: [] };
try { const h = JSON.parse(localStorage.getItem(HKEY) || 'null'); if (h) H = { matches: h.matches || [], lists: h.lists || [], del: h.del || [], mig2: h.mig2 }; } catch (e) {}
const saveH = () => { try { localStorage.setItem(HKEY, JSON.stringify(H)); } catch (e) {} };
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }
const sigOf = ships => ships.map(s => s.pid + ':' + s.ups.map(u => u.id).sort((a, b) => a - b).join('.')).sort().join(';');

    const r = evalEnd();
    if (r) { S.result = r; save(); renderAll(); return openEnd(); }
    commit(() => { S.round++; S.phase = 0; const r = recoverEnd(); return `Round ${S.round} begins${r}`; });
  },
  back() {
    commit(() => { if (S.phase > 0) { S.phase--; return null; } if (S.round > 1) { S.round--; S.phase = PHASES.length - 1; return `Back to round ${S.round}`; } return false; });
  },
  'ship-open'(d) { const s = shipOf(d); OPEN.has(s.uid) ? OPEN.delete(s.uid) : OPEN.add(s.uid); renderPlayers(); },
  hp(d) {
    commit(() => {
      const s = shipOf(d), k = d.k, max = k === 'sh' ? s.shMax : s.hullMax, was = shipState(s);
      const n = clamp(s[k] + +d.d, 0, max); if (n === s[k]) return false;
      s[k] = n; sync(s);
      if (s.hull <= 0) s.dead = true; else if (k === 'hull' && s.dead && +d.d > 0) s.dead = false;
      const now = shipState(s), nm = s.n;
      return now !== was && now !== 'ok' ? `${nm} ${now === 'dead' ? 'destroyed' : 'at half'} (+${shipWorth(s)} to ${S.players[1 - +d.p].name})` : `${nm} ${k === 'sh' ? 'shields' : 'hull'} ${n}/${max}`;
    });
  },
  res(d) { commit(() => { const s = shipOf(d), k = d.k, max = k === 'ch' ? s.chMax : k === 'en' ? s.enMax : s.foMax, n = clamp(s[k] + +d.d, 0, max); if (n === s[k]) return false; s[k] = n; return `${s.n} ${k === 'ch' ? 'charges' : k === 'en' ? 'energy' : 'force'} ${n}/${max}`; }); },
  'up-ch'(d) { commit(() => { const s = shipOf(d), u = s.ups[+d.u], n = clamp(u.c + +d.d, 0, u.cc); if (n === u.c) return false; u.c = n; return `${s.n}: ${u.n} ${n}/${u.cc}`; }); },
  tok(d) { commit(() => { const s = shipOf(d), n = clamp(s.tok[d.k] + +d.d, 0, 9); if (n === s.tok[d.k]) return false; s.tok[d.k] = n; return null; }); },
  dead(d) { commit(() => { const s = shipOf(d); s.dead = !s.dead; if (!s.dead && s.hull <= 0) s.hull = 1; if (s.dead) s.half = true; return s.dead ? `${s.n} destroyed (+${s.pts} to ${S.players[1 - +d.p].name})` : `${s.n} restored`; }); },
  max(d) {
    commit(() => {
      const s = shipOf(d), mk = d.k === 'sh' ? 'shMax' : 'hullMax', n = Math.max(d.k === 'sh' ? 0 : 1, s[mk] + +d.d); if (n === s[mk]) return false;
      s[mk] = n; s[d.k] = clamp(s[d.k] + (+d.d > 0 ? 1 : 0), 0, n); sync(s); return null;
    });
  },
  heal(d) { commit(() => { const sq = S.players[+d.p].squad; sq.ships.forEach(s => { s.hull = s.hullMax; s.sh = s.shMax; s.dead = false; s.half = false; s.ch = s.chMax; s.fo = s.foMax; s.en = s.enMax || 0; s.ups.forEach(u => u.c = u.cc); }); return `${S.players[+d.p].name}'s squad repaired`; }); },
  'sq-clear'(d, b) { confirmTap(b, 'Tap again', () => commit(() => { S.players[+d.p].squad = null; S.players[+d.p].faction = 'none'; return `${S.players[+d.p].name}'s squad removed`; })); },
  'imp-open'(d) { impTarget = d.p != null ? +d.p : 0; $('#imp-text').value = ''; impSel = null; impSelId = ''; renderImport(); $('#dlg-import').showModal(); },
  'imp-target'(d) { impTarget = +d.p; renderImport(); },
  'imp-example'(d) { impSel = null; impSelId = ''; $('#imp-text').value = exampleLink(d.d); impTarget = d.d === 'galacticempire' ? 1 : 0; renderImport(); },
  'imp-load'() {
    if (!impParsed) return;
    commit(() => { const p = S.players[impTarget]; p.squad = impParsed; if (FACTIONS[impParsed.faction] && impParsed.faction !== 'none') p.faction = impParsed.faction; return `${p.name} loaded ${impParsed.name || 'a squad'} (${squadCost(impParsed)} pts)`; });
    $('#dlg-import').close();
  },
  'tok-hide'() { S.settings.hideTok = !S.settings.hideTok; save(); renderAll(); },
  'h-pl'(d) { const i = +d.d; if (HV.pl[i] && !HV.pl[1 - i]) return toast('Keep at least one player on'); HV.pl[i] = !HV.pl[i]; renderHistory(); },
  'set-toggle'(d) { S.settings[d.d] = !S.settings[d.d]; if (d.d === 'tapFilter' && !S.settings.tapFilter) HV.drill = {}; if (d.d === 'p2stats' || d.d === 'tapFilter') { try { renderHistory(); } catch (e) {} } if (d.d === 'sound' && S.settings.sound) { audio(); beep(1); } save(); wake(); renderAll(); },
  'set-min'(d) { setMinutes(+d.d); },
  'set-min-in'() { setMinutes(+$('#min-in').value); },
  'set-rounds'() { const n = clamp(Math.round(+$('#rounds-in').value) || 12, 1, 30); S.settings.rounds = n; S.round = Math.min(S.round, n); save(); renderAll(); },
  'new-game'(d) {
    const saved = S.result && S.result.save !== false;
    if (saved) saveMatch();
    S.round = 1; S.phase = 0; S.log = []; undoStack = []; S.result = null; S.scenario = '';
    S.players.forEach(p => {
      p.manual = 0; p.init = false;
      if (d.d === 'clear') { p.squad = null; p.faction = 'none'; }
      else if (p.squad) p.squad.ships.forEach(s => { s.hull = s.hullMax; s.sh = s.shMax; s.dead = false; s.half = false; s.ch = s.chMax; s.fo = s.foMax; s.en = s.enMax || 0; s.ups.forEach(u => u.c = u.cc); TOKENS.forEach(([k]) => s.tok[k] = 0); });
    });
    lastScores[0] = lastScores[1] = null; timerReset(); $('#dlg-end').close(); save(); renderAll();
    toast(saved ? 'Match saved to history' : 'New game started');
  },
  view(d) { setView(d.d === 'toggle' ? (S.ui.view === 'glance' ? 'board' : 'glance') : d.d); },
  fs() { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} },
  'end-now'() { if (!S.result) S.result = { winner: leader(), reason: 'manual', round: S.round }; save(); renderRound(); openEnd(); },
  'res-win'(d) { S.result.winner = +d.d; save(); renderEnd(); renderRound(); renderGlance(); },
  'res-me'(d) { S.settings.me = +d.d; save(); renderEnd(); },
  'res-save'() { S.result.save = S.result.save === false; save(); renderEnd(); },
  'keep-playing'() { S.result = null; save(); $('#dlg-end').close(); renderAll(); },
  'set-target'() { S.settings.target = clamp(Math.round(+$('#target-in').value) || 50, 10, 200); save(); renderAll(); },
  'sq-fold'(d) { S.ui.collapsed[+d.p] = !S.ui.collapsed[+d.p]; save(); renderPlayers(); },
  'list-save'(d) { const sq = snapSquad(S.players[+d.p].squad); toast(addList(sq) ? 'Saved to your lists' : 'Already in your lists'); },
  'list-use'(d) {
    const l = H.lists.find(x => x.id === d.d); if (!l) return;
    const sq = rebuildList(l);
    commit(() => { const p = S.players[+d.p]; p.squad = sq; if (FACTIONS[l.faction]) p.faction = l.faction; return `${p.name} loaded ${l.name}`; });
    $('#dlg-hist').close(); toast('List loaded');
  },
  'list-del'(d, b) { confirmTap(b, 'Tap again', () => { H.lists = H.lists.filter(x => x.id !== d.d); saveH(); renderHistory(); }); },
  'h-fold'(d) { HFOLD.has(d.d) ? HFOLD.delete(d.d) : HFOLD.add(d.d); try { localStorage.setItem('xwdash.hfold', JSON.stringify([...HFOLD])); } catch (e) {} renderHistory(); },
  'h-slot'(d) { HV.upSlot = d.d; renderHistory(); },
  'h-tab'(d) { HV.tab = d.d; renderHistory(); },
  'h-fac'(d) { HV.fac = d.d; renderHistory(); },
  'h-scope'(d) { HV.scope = d.d; renderHistory(); },
  'h-open'(d) { HOPEN.has(d.d) ? HOPEN.delete(d.d) : HOPEN.add(d.d); renderHistory(); },
  'h-del'(d, b) { confirmTap(b, 'Tap again to delete', () => { H.matches = H.matches.filter(m => m.id !== d.d); H.del = [...(H.del || []), d.d].slice(-1000); saveH(); renderHistory(); }); },
  drill(d) { if (!S.settings.tapFilter) return;
    if (d.k === 'mu') { const [f, o] = d.v.split('|'); HV.fac = f; HV.drill.opp = o; }
    else if (d.k === 'pid') HV.drill.pid = +d.v;
    else HV.drill[d.k] = d.v;
    HV.tab = 'insights'; renderHistory();
  },
  'drill-clear'(d) { delete HV.drill[d.k]; if (d.k === 'opp') HV.fac = 'all'; renderHistory(); },
  'h-sample'() { const r = loadSample(); if (!r) return; HV.tab = 'insights'; renderHistory(); toast(`Loaded ${r.m} sample matches and ${r.l} lists`); },
  'h-unsample'() { H.matches = H.matches.filter(m => !m.sample); H.lists = H.lists.filter(l => !l.sample); saveH(); renderHistory(); toast('Sample data removed'); },
  'd-login'() { location.href = '/api/discord-login'; },
  'd-sync'() { syncNow(); },
  'd-logout'() { logout(); renderHistory(); toast('Logged out'); },
  'h-copy'() {
    const t = $('#bk-text'); t.value = JSON.stringify(H); t.select();
    try { navigator.clipboard.writeText(t.value).then(() => toast('Backup copied'), () => toast('Select the text and copy it')); } catch (e) { toast('Select the text and copy it'); }
  },
  'h-restore'() {
    try {
      const j = JSON.parse($('#bk-text').value); let m = 0, l = 0;
      (j.matches || []).forEach(x => { if (x && x.id && x.p && !H.matches.some(y => y.id === x.id)) { H.matches.push(x); m++; } });
      (j.lists || []).forEach(x => { if (x && x.sig && !H.lists.some(y => y.sig === x.sig)) { H.lists.push(x); l++; } });
      H.matches.sort((a, b) => b.t - a.t); saveH(); renderHistory(); toast(`Restored ${m} matches and ${l} lists`);
    } catch (e) { toast('That backup could not be read'); }
  },
  'reset-all'(d, b) { confirmTap(b, 'Tap again to erase everything', () => { S = fresh(); undoStack = []; OPEN.clear(); lastScores[0] = lastScores[1] = null; save(); $('#dlg-set').close(); renderAll(); }); },
};
// Recurring values come from YASB: a positive number is how many a card recovers each End Phase, a negative number is how many it loses.
const recAmt = r => r === true ? 1 : (+r || 0);
const recNote = r => { r = recAmt(r); return r > 0 ? `▲${r} each round` : r < 0 ? `▼${-r} each round` : ''; };
// Force recovers 1 per End Phase unless the card says otherwise (Keo Venzee, The Mandalorian and The Child do not recover).
function forceRate(s) {
  const d = D.pilots[s.pid] || {};
  if (d.fr != null) return d.fr;
  if (d.fo) return 1;
  const withForce = s.ups.map(u => D.upgrades[u.id]).filter(x => x && x.fo);
  return withForce.length && withForce.every(x => x.fr === 0) ? 0 : 1;
}
// End of the End Phase: Force, recurring charges, and the shields and energy of Huge ships recover (or decay) automatically.
function recoverEnd() {
  const n = { force: 0, charge: 0, shield: 0, energy: 0 };
  S.players.forEach(p => p.squad && p.squad.ships.forEach(s => {
    if (shipState(s) === 'dead') return;
    const d = D.pilots[s.pid] || {}, sh = D.ships[s.ship] || {};
    if (s.foMax) { const v = clamp(s.fo + forceRate(s), 0, s.foMax); if (v !== s.fo) { s.fo = v; n.force++; } }
    if (s.chMax && recAmt(d.r)) { const v = clamp(s.ch + recAmt(d.r), 0, s.chMax); if (v !== s.ch) { s.ch = v; n.charge++; } }
    s.ups.forEach(u => { const ud = D.upgrades[u.id] || {}; if (u.cc && recAmt(ud.r)) { const v = clamp(u.c + recAmt(ud.r), 0, u.cc); if (v !== u.c) { u.c = v; n.charge++; } } });
    if (sh.sr && s.shMax) { const v = clamp(s.sh + sh.sr, 0, s.shMax); if (v !== s.sh) { s.sh = v; n.shield++; } }
    if (sh.er && s.enMax) { const v = clamp(s.en + sh.er, 0, s.enMax); if (v !== s.en) { s.en = v; n.energy++; } }
  }));
  const parts = [];
  if (n.force) parts.push(`Force on ${n.force} ship${n.force > 1 ? 's' : ''}`);
  if (n.charge) parts.push(`${n.charge} recurring charge${n.charge > 1 ? 's' : ''}`);
  if (n.shield) parts.push(`shields on ${n.shield} large ship${n.shield > 1 ? 's' : ''}`);
  if (n.energy) parts.push(`energy on ${n.energy} large ship${n.energy > 1 ? 's' : ''}`);
  return parts.length ? ' · recovered ' + parts.join(', ') : '';
}
function setMinutes(m) {
  m = clamp(Math.round(m) || 75, 5, 240); const t = S.timer, old = t.total;
  S.settings.minutes = m; t.total = m * 60000;
  if (t.status === 'idle' || t.status === 'done') { t.status = 'idle'; t.remaining = t.total; }
  else { const diff = t.total - old, r = Math.max(0, remaining() + diff); if (t.status === 'running') t.endAt = Date.now() + r; else t.remaining = r; }
  syncWarned(); save(); renderAll();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = A[b.dataset.act]; if (f) f(b.dataset, b, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.name != null) { const p = S.players[+t.dataset.name]; p.name = t.value.trim().slice(0, 24) || 'Player ' + (+t.dataset.name + 1); save(); renderAll(); }
  if (t.dataset.scn != null) { S.scenario = t.value; if (t.value) addLog('Scenario: ' + SCENARIOS[t.value].n); save(); renderAll(); }
  if (t.dataset.lname != null) { const l = H.lists.find(x => x.id === t.dataset.lname); if (l) { l.name = t.value.trim().slice(0, 40) || l.name; saveH(); renderHistory(); } }
});
document.addEventListener('animationend', e => e.target.classList.remove('bump'));
$('#imp-text').addEventListener('input', () => { impSel = null; impSelId = ''; renderImport(); });
$('#imp-saved').addEventListener('change', e => { impSelId = e.target.value; const l = H.lists.find(x => x.id === impSelId); impSel = l ? rebuildList(l) : null; if (l) $('#imp-text').value = ''; renderImport(); });
document.addEventListener('input', e => { if (e.target.id === 'end-notes' && S.result) { S.result.notes = e.target.value; save(); } });
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.scen-d')) scnOpen = e.target.open; }, true);
let tx = 0, ty = 0, tt = 0, tracking = false;
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || document.querySelector('dialog[open]')) { tracking = false; return; }
  const t = e.touches[0]; tx = t.clientX; ty = t.clientY; tt = Date.now(); tracking = !e.target.closest('input, textarea, select');
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!tracking) return; tracking = false;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - tt < 800) setView(dx < 0 ? 'glance' : 'board');
}, { passive: true });
document.addEventListener('keydown', e => {
  if (document.querySelector('dialog[open]') || /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); A['timer-toggle'](); }
  else if (e.key === 'ArrowRight') A.next();
  else if (e.key === 'ArrowLeft') A.back();
  else if (e.key.toLowerCase() === 'z') undo();
  else if (e.key.toLowerCase() === 'g') A.view({ d: 'toggle' });
  else if (e.key === 'Escape' && S.ui.view === 'glance') setView('board');
});
document.addEventListener('visibilitychange', () => { tick(); wake(); });
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

/* ---------- boot ---------- */
// Early versions counted upgrade costs in a ship's points. Squad points are the pilot cost only.
function migrate() {
  S.players.forEach(p => { p.faction = p.squad && FACTIONS[p.squad.faction] && p.squad.faction !== 'none' ? p.squad.faction : (p.squad ? p.faction : 'none'); });
  const cost = id => { const p = D.pilots[id]; return p ? (Array.isArray(p.p) ? p.p[0] : p.p || 0) : null; };
  if (!S.mig2) {
    S.players.forEach(p => p.squad && p.squad.ships.forEach(s => { const c = cost(s.pid); if (c != null) { s.pts = c; s.load = s.ups.reduce((a, u) => a + (u.p || 0), 0); s.lo = (D.pilots[s.pid] || {}).lo ?? null; } }));
    S.mig2 = 1; save();
  }
  if (!S.mig3) {
    S.players.forEach(p => p.squad && p.squad.ships.forEach(s => { if (s.enMax == null) { const e = (D.ships[s.ship] || {}).en || 0; s.en = e; s.enMax = e; } }));
    S.mig3 = 1; save();
  }
  if (!H.mig2) {
    H.matches.forEach(m => m.p.forEach(p => { if (p.squad) { p.squad.ships.forEach(s => { const c = cost(s.pid); if (c != null) s.pts = c; }); p.squad.cost = p.squad.ships.reduce((a, s) => a + s.pts, 0); } }));
    H.lists.forEach(l => { l.points = l.ships.reduce((a, x) => a + (cost(x.pid) || 0), 0); });
    H.mig2 = 1; saveH();
  }
}
(function boot() {
  const t = S.timer;
  if (t.status === 'running' && t.endAt <= Date.now()) { t.status = 'done'; t.remaining = 0; }
  if (t.total !== S.settings.minutes * 60000 && t.status === 'idle') { t.total = t.remaining = S.settings.minutes * 60000; }
  migrate(); takeAuth();
  // First run: show five sample games so the History screens have something to display. They are marked as samples and can be removed there.
  try { if (H.matches.some(m => m.sample) || H.lists.some(l => l.sample)) { H.matches = H.matches.filter(m => !m.sample); H.lists = H.lists.filter(l => !l.sample); saveH(); } localStorage.setItem('xwdash.sample1', '1'); } catch (e) {}
  syncWarned(); buildTicks(); renderAll(); wake();
  if (!document.fullscreenEnabled) $('#g-fs').hidden = true;
  setView(S.ui.view === 'glance' ? 'glance' : 'board');
  setInterval(tick, 250);
})();
})();
